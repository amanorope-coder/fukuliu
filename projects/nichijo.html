<!-- 企画「日常を地図」：projects/nichijo/manifest.json の写真を3列に並べる（article.js）。
     写真は記事メーカーの「🗺 日常を地図」タブから追加。並びは新しい順（投稿順／日付順を切り替え）。日付とメモは、PCはマウスを乗せたとき・スマホはタップしたときだけ出る -->
<body class="ar-page" data-root="../">
<main class="ar" data-kind="page" data-on="project">
    <header class="pg-head pg-head--project">
        <div class="pg-head__in">
            <p class="pg-head__crumb"><a href="../index.html#project">PROJECT</a><span>企画層 −20m</span></p>
            <p class="pg-head__display">ATLAS EVERYDAY</p>
            <h1 class="pg-head__name">日常を地図</h1>
            <p class="pg-head__desc">毎日一枚、地図の代わりに。</p>
            <p class="pg-head__count" id="photo-count"></p>
        </div>
    </header>
    <div class="pj-page">
        <div class="pg-body">
            <div class="pm-bar">
                <div class="pm-bar__g" role="group" aria-label="並び順">
                    <button type="button" class="is-on" data-sort="post" aria-pressed="true">投稿順</button>
                    <button type="button" data-sort="date" aria-pressed="false">日付順</button>
                </div>
                <div class="pm-bar__g" role="group" aria-label="写真の見せ方">
                    <button type="button" class="is-on" data-view="square" aria-pressed="true"><i class="pm-ico pm-ico--sq" aria-hidden="true"></i>スクエア</button>
                    <button type="button" data-view="natural" aria-pressed="false"><i class="pm-ico pm-ico--nt" aria-hidden="true"></i>オリジナル</button>
                </div>
            </div>
            <div class="pm-grid" id="photo-map"><p class="nwl__empty">読み込み中…</p></div>
            <div class="pj-tags" id="project-tags" data-project="nichijo"></div>
        </div>
    </div>
</main>
<script src="../article.js"></script>
</body>
